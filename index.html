<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disney - Proyecto educativo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <img src="images/logo.png" alt="Disney" class="logo">
    <nav>
      <a href="#peliculas">Películas</a>
      <a href="#disney-plus">Disney+</a>
      <a href="#parques">Parques</a>
      <a href="#tienda">Tienda</a>
      <a href="#mas">Más</a>
    </nav>
  </header>

  <main>
    <section class="banner">
      <img src="images/snow-white.png" alt="Blancanieves" class="banner__img">
      <div class="banner__text">
        <h1>Blancanieves</h1>
        <p>Una historia inolvidable llega a la pantalla.</p>
        <a href="#peliculas" class="btn">Ver más</a>
      </div>
    </section>

    <section id="peliculas" class="section">
      <h2>Películas</h2>
      <div class="grid grid--5">
        <img src="images/movies-1.jpeg" alt="Película 1">
        <img src="images/movies-2.jpeg" alt="Película 2">
        <img src="images/movies-3.jpeg" alt="Película 3">
        <img src="images/movies-4.jpeg" alt="Película 4">
        <img src="images/movies-5.jpeg" alt="Película 5">
      </div>
    </section>

    <section id="disney-plus" class="section section--dark">
      <h2>Disney+</h2>
      <div class="grid grid--3">
        <img src="images/disney-plus-1.png" alt="Disney+ 1">
        <img src="images/disney-plus-2.png" alt="Disney+ 2">
        <img src="images/disney-plus-3.png" alt="Disney+ 3">
      </div>
    </section>

    <section id="parques" class="section">
      <h2>Parques Disney</h2>
      <div class="grid grid--2">
        <img src="images/disney-parks-1.png" alt="Parque Disney 1">
        <img src="images/disney-parks-2.png" alt="Parque Disney 2">
      </div>
    </section>

    <section id="tienda" class="section">
      <h2>Tienda</h2>
      <div class="grid grid--4">
        <img src="images/shop-image-1.png" alt="Producto 1">
        <img src="images/shop-image-2.png" alt="Producto 2">
        <img src="images/shop-image-3.png" alt="Producto 3">
        <img src="images/shop-image-4.png" alt="Producto 4">
      </div>
    </section>

    <section id="mas" class="more">
      <h2>Descubre más</h2>
      <a href="#" class="btn">Explorar</a>
    </section>
  </main>

  <footer class="footer">
    <img src="images/logo.png" alt="Disney" class="logo">
    <p>Sitio con fines educativos y académicos.</p>
  </footer>
</body>
</html>
